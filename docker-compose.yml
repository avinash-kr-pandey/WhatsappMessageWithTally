version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: tally_whatsapp_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - integration_net

  redis:
    image: redis:7-alpine
    container_name: tally_whatsapp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - integration_net

volumes:
  mongo_data:
  redis_data:

networks:
  integration_net:
    driver: bridge
